models:
  - id: tts-default
    direction: tts
    object: model
    display_name: Default TTS
    provider: irodori
    engine: base
    defaults:
      response_format: wav
      speed: 1.0
      timeout_sec: 120
    provider_config:
      checkpoint: Aratako/Irodori-TTS-500M-v2
      model_device: cuda
      codec_device: cuda
      model_precision: fp32
      codec_precision: fp32
      max_text_len: 1024
      max_caption_len: 1024

  - id: irodori-voicedesign
    direction: tts
    object: model
    display_name: Irodori VoiceDesign
    provider: irodori
    engine: voicedesign
    defaults:
      response_format: wav
      speed: 1.0
      timeout_sec: 120
    provider_config:
      checkpoint: Aratako/Irodori-TTS-500M-v2-VoiceDesign
      model_device: cuda
      codec_device: cuda
      model_precision: fp32
      codec_precision: fp32
      max_text_len: 1024
      max_caption_len: 1024

  - id: tts-fake
    direction: tts
    object: model
    display_name: Fake TTS
    provider: fake
    engine: base
    defaults:
      response_format: wav
      speed: 1.0
      timeout_sec: 120
    provider_config: {}

  - id: aivis-default
    direction: tts
    object: model
    display_name: AivisSpeech Engine
    provider: aivis_speech
    engine: voicevox-compatible
    defaults:
      response_format: wav
      speed: 1.0
      timeout_sec: 120
    provider_config:
      speaker: 888753760
      output_sampling_rate: 24000
      output_stereo: false

  # STT
  - id: stt-default
    direction: stt
    object: model
    display_name: ReazonSpeech K2 v2
    provider: reazonspeech_k2
    engine: k2
    defaults:
      language: ja
      max_audio_seconds: 30
      timeout_sec: 120
    provider_config:
      model_id: reazon-research/reazonspeech-k2-v2
      precision: fp32
